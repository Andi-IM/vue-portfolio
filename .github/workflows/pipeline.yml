name: CI/CD Pipeline

on:
  push:
    branches: ['**']
    paths:
      - 'src/**'
      - 'functions/**'
      - 'public/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - 'quasar.config.ts'
      - 'vitest.config.ts'
      - 'vite.config.ts'
      - 'index.html'
      - 'wrangler.toml'
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    branches: ['**']
    paths:
      - 'src/**'
      - 'functions/**'
      - 'public/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - 'quasar.config.ts'
      - 'vitest.config.ts'
      - 'vite.config.ts'
      - 'index.html'
      - 'wrangler.toml'
      - '.github/workflows/**'
      - '.github/actions/**'

jobs:
  codeql:
    name: CodeQL Analysis
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write
    secrets: inherit

  ci:
    name: Continuous Integration
    needs: codeql
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  e2e:
    name: End-to-End Tests
    needs: ci
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  release:
    name: Semantic Release
    needs: e2e
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
    secrets: inherit

  deploy:
    name: Deploy to Cloudflare Pages
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/cloudflare_worker_deployment.yml
    permissions:
      contents: read
      deployments: write
    secrets: inherit
