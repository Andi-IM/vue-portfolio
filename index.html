<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128x128.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png" />
    <link rel="icon" type="image/ico" href="/favicon.ico" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />
    <meta name="robots" content="index, follow" />
    <meta name="google-adsense-account" content="ca-pub-1594065720287624" />

    <!-- Preload the Largest Contentful Paint image -->
    <link rel="preload" as="image" href="/images/portrait.webp" fetchpriority="high" />

    <!-- Preconnect to critical origins for faster resource loading -->
    <link rel="preconnect" href="https://static.cloudflareinsights.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title><%= productName %></title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Andi Irham",
        "jobTitle": "Mobile App Developer",
        "url": "https://andi-im.pages.dev",
        "description": "Andi Irham - Mobile App Developer & AI Enthusiast. Specializing in Android, Kotlin, Flutter development.",
        "sameAs": ["https://github.com/Andi-IM", "https://www.linkedin.com/in/andiirham/"]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Andi IM Portfolio",
        "url": "https://andi-im.pages.dev",
        "description": "Andi Irham Portfolio - Mobile App Developer & AI Enthusiast"
      }
    </script>
  </head>

  <body class="bg-gray-900">
    <div id="app">
      <!-- quasar:entry-point -->
    </div>
  </body>
</html>
